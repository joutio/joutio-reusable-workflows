name: Mobile CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
    secrets:
      GITHUB_PASSWORD:
        description: "GitHub token (PAT) used for GitHub Packages authentication (paquets npm @joutio/*)"
        required: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node + npm
        uses: joutio/joutio-reusable-workflows/actions/setup-node-npm@main
        with:
          node-version: ${{ inputs.node-version }}
          server-password: ${{ secrets.GITHUB_PASSWORD }}

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npx expo-doctor
