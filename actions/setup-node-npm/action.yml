name: Setup Node npm (GitHub Packages)
description: Configure Node + npm cache and optional GitHub Packages credentials (paquets @joutio/*), comme setup-java-maven.
inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"
  cache:
    description: Dependency cache strategy
    required: false
    default: npm
  server-password:
    description: Token (PAT) used by npm/GitHub Packages
    required: false
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}

    - name: Copy .npmrc to ~/.npmrc
      if: ${{ inputs.server-password != '' }}
      shell: bash
      run: cp "${{ github.action_path }}/../../npm/.npmrc" ~/.npmrc

    - name: Export credentials to GITHUB_ENV
      if: ${{ inputs.server-password != '' }}
      shell: bash
      run: echo "SERVER_PASSWORD=${{ inputs.server-password }}" >> $GITHUB_ENV
